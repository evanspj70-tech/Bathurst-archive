    <style>
        :root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --border-color: #333;
    --accent-blue: #e53935; /* Changed from blue to Bathurst Red */
    --accent-orange: #ff9800; 
    --text-main: #f0f0f0;
    --text-muted: #aaa;
}

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        /* Quick Condition & Scalable Filters */
        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background: #2a2a2a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        /* Decade Grid Selector Panel */
        .decade-selector-panel {
            max-width: 1200px;
            margin: 0 auto 35px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .decade-group h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .year-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .year-btn {
            background: #252525;
            color: var(--text-main);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .year-btn:hover {
            border-color: var(--accent-blue);
            background: #2a3b40;
        }

        .year-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
            font-weight: bold;
        }

        /* Grid Container for Cards */
        #weather-archive-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card Styling */
        .weather-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--accent-blue);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        .weather-card:hover {
            transform: translateY(-3px);
        }

        .weather-card.track-wet, .weather-card.track-flooded, .weather-card.track-damp {
            border-left-color: var(--accent-orange);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .weather-stats {
            display: flex;
            gap: 6px;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 4px;
            margin: 10px 0;
            justify-content: space-between;
        }

        .conditions-text, .winner, .race-title {
            font-size: 0.9rem;
            margin: 6px 0;
        }

        .race-title {
            color: var(--text-muted);
            font-weight: 500;
        }

        .notable-events {
            font-size: 0.85rem;
            color: #ffccbc;
            margin-top: 8px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 6px;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>

    <!-- Main page logic -->
<script>
        function getWeatherIcon(trackState, rainMm) {
            const state = (trackState || "").toLowerCase();
            if (state.includes("wet") || state.includes("flood") || rainMm > 5) return "🌧️";
            if (state.includes("showers") || (rainMm > 0 && rainMm <= 5)) return "🌦️";
            return "☀️";
        }

        function renderWeatherArchive(data) {
            const container = document.getElementById("weather-archive-container");
            container.innerHTML = "";

            if (data.length === 0) {
                container.innerHTML = `<div class="no-results">No weather records match this filter selection.</div>`;
                return;
            }

            data.forEach(race => {
                const w = race.weather || {};
                const icon = getWeatherIcon(w.track_state, w.rainfall_mm);
                const trackClass = w.track_state ? w.track_state.toLowerCase().split(' ')[0] : 'dry';
                const safetyCars = w.safety_cars ?? 0;

                const card = document.createElement("div");
                card.className = `weather-card track-${trackClass}`;
                card.innerHTML = `
                  <div class="weather-header">
                    <span class="weather-year">${race.year}</span>
                    <span class="weather-icon" title="${w.track_state || 'Dry'}">${icon}</span>
                  </div>
                  <div class="race-title">${race.race_name || 'Bathurst 1000'}</div>
                  <p class="winner"><strong>Winners:</strong> ${race.winner}</p>
                  <div class="weather-stats">
                    <span>🌡️ Max: ${w.temp_max_c ?? 'N/A'}°C</span>
                    <span>💧 Rain: ${w.rainfall_mm ?? 0} mm</span>
                    <span>🚗 SC: ${safetyCars}</span>
                  </div>
                  <p class="conditions-text"><strong>Conditions:</strong> ${w.conditions || 'N/A'}</p>
                  ${w.notable_events ? `<p class="notable-events"><em>⚡ ${w.notable_events}</em></p>` : ''}
                `;
                container.appendChild(card);
            });
        }

        // Scalable Filter Logic
        function filterByCriteria(criteria) {
            document.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${criteria === 'high-sc' ? 'sc' : criteria}`).classList.add('active');

            let filteredData = bathurstRaceData;

            if (criteria === 'wet') {
                filteredData = bathurstRaceData.filter(r => {
                    const w = r.weather || {};
                    return (w.rainfall_mm > 2.0) || (w.track_state && (w.track_state.toLowerCase().includes('wet') || w.track_state.toLowerCase().includes('damp')));
                });
            } else if (criteria === 'hot') {
                filteredData = bathurstRaceData.filter(r => (r.weather?.temp_max_c || 0) > 24.0);
            } else if (criteria === 'cool') {
                filteredData = bathurstRaceData.filter(r => (r.weather?.temp_max_c || 99) < 16.0);
            } else if (criteria === 'high-sc') {
                filteredData = bathurstRaceData.filter(r => (r.weather?.safety_cars || 0) >= 5);
            }

            renderWeatherArchive(filteredData);
        }

        // Filter by Specific Year Button
        function filterByYear(year, buttonElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            const filteredData = bathurstRaceData.filter(r => r.year === year);
            renderWeatherArchive(filteredData);
        }

        // Initial render on page load
        document.addEventListener("DOMContentLoaded", () => {
            renderWeatherArchive(bathurstRaceData);
        });
    </script>
